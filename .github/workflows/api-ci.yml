name: API CI

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "database/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "database/**"
      - ".github/workflows/api-ci.yml"

jobs:
  unit:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check app tests

      - name: Pytest
        run: pytest -q -m "not integration"

  spatial-integration:
    runs-on: ubuntu-latest
    needs: unit

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: vela_muslim_travel
          POSTGRES_USER: vela
          POSTGRES_PASSWORD: vela_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vela -d vela_muslim_travel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+asyncpg://vela:vela_test@localhost:5432/vela_muslim_travel
      PGPASSWORD: vela_test
      RUN_INTEGRATION: "1"
      ALLOW_TEST_FIXTURES: "true"

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Initialize PostGIS schema
        run: |
          psql -h localhost -U vela -d vela_muslim_travel -f ../../database/schema.sql
          psql -h localhost -U vela -d vela_muslim_travel -f ../../database/seeds/001_phase0_test_fixtures.sql

      - name: Run database migrations
        run: python -m app.migrations

      - name: Stage real-world pilot candidates
        run: python -m app.tools.import_candidates ../../database/seeds/pilot_candidates_review_queue.csv --apply

      - name: Spatial integration tests
        run: pytest -q -m integration
