name: Container CI

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "database/**"
      - "docker-compose.prod.yml"
      - "deploy/**"
      - ".github/workflows/container-ci.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "database/**"
      - "docker-compose.prod.yml"
      - "deploy/**"
      - ".github/workflows/container-ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      ADMIN_API_KEY: ci-admin-key
      WEB_PORT: "8080"
      CORS_ORIGINS: http://localhost:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose
        run: docker compose -f docker-compose.prod.yml config

      - name: Check backup script syntax
        run: sh -n deploy/backup-db.sh

      - name: Build API image
        run: docker build -t vela-muslim-travel-api:ci apps/api

      - name: Build web image
        run: docker build -t vela-muslim-travel-web:ci apps/web

      - name: Start production stack
        run: docker compose -f docker-compose.prod.yml up -d --build

      - name: Smoke test API through web proxy
        run: |
          curl --fail --silent --show-error             --retry 20 --retry-delay 2 --retry-all-errors             http://localhost:8080/api/health | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json

      - name: Smoke test web shell
        run: |
          curl --fail --silent --show-error             --retry 10 --retry-delay 2 --retry-all-errors             http://localhost:8080/ | tee /tmp/index.html
          grep -q "Vela Muslim Travel" /tmp/index.html

      - name: Show container status
        if: always()
        run: docker compose -f docker-compose.prod.yml ps

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --no-color --tail=200

      - name: Stop production stack
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v
