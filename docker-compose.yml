services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: vela_muslim_travel
      POSTGRES_USER: vela
      POSTGRES_PASSWORD: vela_dev
    ports:
      - "5432:5432"
    volumes:
      - vela_muslim_travel_db:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vela -d vela_muslim_travel"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vela_muslim_travel_db:
